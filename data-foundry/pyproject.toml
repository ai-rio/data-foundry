[project]
name = "data-foundry"
version = "0.1.0"
description = "Enrichment-as-a-Service (EaaS) platform - AI-powered data cleaning and labeling with Human-in-the-Loop verification"
authors = [{name = "Data Foundry Team", email = "team@datafoundry.com"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core API Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Database & Models
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.8",
    # Configuration & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Data Processing
    "dlt[all]>=0.5.0",
    "pandas>=2.1.0",
    # Background Tasks & Orchestration
    "prefect>=2.14.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    # AI & ML (API-based - minimal local dependencies)
    "openai>=1.5.0",
    "anthropic>=0.8.0",
    # Privacy & Security
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Business & Billing
    "stripe>=7.5.0",
    # HTTP & Async
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",
    # Utilities
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    # "label-studio-sdk>=1.0.7",  # Removed - Label Studio has its own container
    # "transformers>=4.35.0",  # Removed - using API-based AI
    # "torch>=2.0.0",  # Removed - using API-based AI
    # "scikit-learn>=1.3.0",  # Removed - using API-based AI
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

# NOTE: ML dependencies will be added later when needed
# For now, we use API-based AI (OpenAI/Anthropic) which requires no heavy local models

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
