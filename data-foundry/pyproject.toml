[project]
name = "data-foundry"
version = "0.1.0"
description = "Enrichment-as-a-Service (EaaS) platform - AI-powered data cleaning and labeling with Human-in-the-Loop verification"
authors = [{name = "Data Foundry Team", email = "team@datafoundry.com"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core API Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "slowapi>=0.1.9", # CRITICAL #2 - Rate limiting (Week 4 Phase 2.1)
    # Database & Models
    "sqlmodel>=0.0.27",
    "sqlalchemy>=2.0.45",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.8",
    # Configuration & Validation
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "pydantic-extra-types>=2.10.0",
    # Data Processing
    "dlt>=1.20.0",
    "pandas>=2.1.0",
    # Background Tasks & Orchestration
    "prefect>=3.6.0",
    "celery>=5.3.0",
    "redis[hiredis]>=5.0.0",
    # AI & ML (API-based + ML Infrastructure)
    "openai>=1.5.0",
    "anthropic>=0.8.0",
    "litellm>=1.0.0",
    # ML Dependencies (Week 3 - Signal Detection)
    "scikit-learn>=1.5.0", # Random Forest, TF-IDF vectorization
    "joblib>=1.4.0", # Model serialization/deserialization
    "numpy>=1.26.0", # Feature arrays and numerical operations
    # Privacy & Security
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    # NLP for PII Detection
    "spacy>=3.8.11",
    "spacy-legacy>=3.0.12",
    "spacy-loggers>=1.0.5",
    # Business & Billing
    "stripe>=10.0.0", # Stripe Python SDK v10+ with v2 billing API support
    # HTTP & Async
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",
    # Utilities
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    # Label Studio (optional, has separate container)
    # "label-studio-sdk>=1.0.7",
    "pyjwt>=2.10.1",
    "python-dotenv-vault>=0.7.0",
    "structlog>=25.5.0",
    "hvac>=2.4.0",
    "cryptography>=44.0.3",
    "fpdf>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "typer>=0.19.2",
    "black>=25.12.0",
    "isort>=5.13.2",
    "mypy>=1.19.1",
    "mypy-extensions>=1.1.0",
    "pre-commit>=3.5.0",
]

# ML Infrastructure (Week 3 - Signal Detection)
# Signal detection, feature engineering, and ML quality prediction
# - Rule-based signal detection with regex patterns
# - TF-IDF vectorization for text feature extraction
# - Random Forest classifier for quality prediction
# - Model serialization with joblib

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # Line too long (handled by formatter)
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501", "F401"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0.tar.gz" }

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=5.13.2",
    "mypy>=1.19.1",
    "mypy-extensions>=1.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "typer>=0.19.2",
    "httpx>=0.25.0",
]
