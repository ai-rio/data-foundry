# Integration Test Configuration
# Configuration for running integration tests in different environments

# Test environment settings
test_environments:
  development:
    database_url: "sqlite:///./test_consent_dev.db"
    redis_url: "redis://localhost:6379/0"
    log_level: "DEBUG"
    ip_hash_salt: "dev_test_salt_for_integration_32_characters_min"
    jwt_secret: "dev_jwt_secret_for_testing_32_characters_minimum"

  staging:
    database_url: "postgresql://postgres:postgres@localhost:5433/test_staging"
    redis_url: "redis://localhost:6380/1"
    log_level: "INFO"
    ip_hash_salt: ${STAGING_IP_SALT}
    jwt_secret: ${STAGING_JWT_SECRET}
    connection_pool_size: 10
    connection_timeout: 30

  production:
    database_url: ${PROD_DB_URL}
    redis_url: ${PROD_REDIS_URL}
    log_level: "WARNING"
    ip_hash_salt: ${PROD_IP_SALT}
    jwt_secret: ${PROD_JWT_SECRET}
    connection_pool_size: 20
    connection_timeout: 60
    read_only_mode: true  # Read-only for production tests

# Test suite configurations
test_suites:
  # Unit tests
  unit:
    path: "tests/unit"
    timeout: 300
    parallel: true
    markers:
      - "unit"
    requirements:
      - "Python >= 3.8"
      - "pytest >= 7.0"

  # Integration tests
  integration:
    path: "tests/integration"
    timeout: 1800
    parallel: false
    markers:
      - "integration"
    requirements:
      - "PostgreSQL or SQLite"
      - "Redis (optional)"
    databases:
      - "consent_records"
      - "audit_logs"
    cleanup:
      auto_cleanup: true
      preserve_data: false

  # API endpoint tests
  api:
    path: "tests/integration/test_consent_api_endpoints.py"
    timeout: 900
    parallel: false
    markers:
      - "api"
    dependencies:
      - "FastAPI"
      - "httpx"
    endpoints:
      - "/consent/grant"
      - "/consent/verify"
      - "/consent/withdraw"
      - "/consent/history"
      - "/consent/object"

  # Performance benchmarks
  performance:
    path: "tests/integration/test_performance_benchmarks.py"
    timeout: 3600
    parallel: false
    markers:
      - "performance"
      - "slow"
    thresholds:
      response_time_p95: 1.0  # seconds
      operations_per_second: 10
      memory_increase_mb: 500
    resources:
      min_memory_gb: 2
      min_cpu_cores: 2

  # Security tests
  security:
    path: "tests/integration/test_consent_management_complete.py::TestSecurityIntegration"
    timeout: 900
    parallel: false
    markers:
      - "security"
    checks:
      - "Input validation"
      - "SQL injection prevention"
      - "XSS prevention"
      - "Authentication bypass"
      - "Authorization bypass"
    tools:
      - "bandit"
      - "safety"

  # GDPR compliance tests
  gdpr:
    path: "tests/integration/test_consent_management_complete.py::TestGDPRComplianceIntegration"
    timeout: 600
    parallel: false
    markers:
      - "gdpr"
      - "compliance"
    articles:
      - "Article 7: Conditions for consent"
      - "Article 17: Right to erasure"
      - "Article 20: Data portability"
      - "Article 21: Right to object"
    documentation_required: true

  # Database tests
  database:
    path: "tests/integration/test_consent_database.py"
    timeout: 600
    parallel: false
    markers:
      - "database"
    checks:
      - "Transaction integrity"
      - "Index performance"
      - "Backup recovery"
      - "Data consistency"
    migrations:
      auto_apply: true
      rollback_test: true

# Reporting configuration
reporting:
  formats:
    - "html"      # Human-readable HTML report
    - "json"      # Machine-readable JSON
    - "junit"     # CI/CD integration

  coverage:
    enabled: true
    threshold: 80      # Minimum coverage percentage
    fail_below_threshold: true
    report_formats:
      - "html"
      - "xml"
      - "term"
    exclude_paths:
      - "*/tests/*"
      - "*/migrations/*"
      - "*/venv/*"
      - "*/__pycache__/*"

  artifacts:
    directory: "test_artifacts"
    retention_days: 30
    compress: true
    upload_to_s3: false
    s3_bucket: ""

  # Performance metrics
  metrics:
    collect: true
    export_prometheus: false
    prometheus_gateway: ""

# Notification settings
notifications:
  email:
    enabled: false
    smtp_server: "smtp.example.com"
    smtp_port: 587
    smtp_username: ${SMTP_USERNAME}
    smtp_password: ${SMTP_PASSWORD}
    recipients:
      - "dev-team@example.com"
    on_events:
      - "failure"
      - "timeout"

  slack:
    enabled: false
    webhook_url: ${SLACK_WEBHOOK_URL}
    channel: "#testing"
    username: "TestBot"
    on_events:
      - "failure"
      - "success"
      - "timeout"

  teams:
    enabled: false
    webhook_url: ${TEAMS_WEBHOOK_URL}
    on_events:
      - "failure"

# Performance test configuration
performance_testing:
  load_testing:
    concurrent_users: [10, 50, 100]
    duration: [60, 300, 600]  # seconds
    ramp_up: [10, 30, 60]     # seconds

  stress_testing:
    max_concurrent_users: 500
    duration: 1800  # 30 minutes
    error_threshold: 0.01  # 1% error rate

  endurance_testing:
    duration: 86400  # 24 hours
    sampling_interval: 60  # seconds

# Security testing configuration
security_testing:
  vulnerability_scan:
    enabled: true
    tools:
      - "bandit"
      - "safety"
      - "semgrep"

  penetration_testing:
    enabled: false
    scenarios:
      - "SQL injection"
      - "XSS"
      - "CSRF"
      - "Authentication bypass"

  dependency_check:
    enabled: true
    check_licenses: true
    check_vulnerabilities: true

# Compliance checking
compliance:
  gdpr:
    enabled: true
    data_protection_impact_assessment: true
    privacy_by_design: true

  sox:
    enabled: false

  hipaa:
    enabled: false

  iso27001:
    enabled: false

# Database configuration for tests
database_testing:
  fixtures:
    auto_load: true
    cleanup_after_test: true

  seeds:
    user_records: 100
    consent_records: 1000
    audit_records: 5000

  transactions:
    test_isolation: true
    rollback_on_failure: true

# API testing configuration
api_testing:
  base_url: "http://localhost:8000"
  version: "v1"

  authentication:
    type: "jwt"
    auto_generate_token: true

  rate_limiting:
    test_limits: true
    bypass_for_tests: true

  headers:
    default:
      Content-Type: "application/json"
      Accept: "application/json"

# Test data management
test_data:
  generation:
    faker_providers:
      - "person"
      - "company"
      - "internet"
      - "datetime"

    locales: ["en_US", "en_GB"]

  cleanup:
    auto_cleanup: true
    preserve_on_failure: true

  isolation:
    per_test: true
    unique_identifiers: true

# Environment-specific overrides
environments:
  ci:
    parallel: true
    coverage:
      threshold: 85
    artifacts:
      upload_to_s3: true
    notifications:
      email:
        enabled: true
      slack:
        enabled: true

  local:
    parallel: false
    log_level: "DEBUG"
    coverage:
      threshold: 75

# Custom test markers
markers:
  slow: "Tests that take a long time to run"
  integration: "Integration tests that require external services"
  unit: "Unit tests that can run in isolation"
  security: "Security-related tests"
  performance: "Performance benchmarks"
  gdpr: "GDPR compliance tests"
  api: "API endpoint tests"
  database: "Database-specific tests"
  authentication: "Authentication and authorization tests"