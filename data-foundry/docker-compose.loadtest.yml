# Phase 6.5 Load Testing Docker Compose
# Adds k6 service to existing stack for integrated testing

services:
  # Existing services from main docker-compose.yml
  db:
    image: postgres:15-alpine
    container_name: data_foundry_db
    environment:
      POSTGRES_USER: foundry_user
      POSTGRES_PASSWORD: foundry_password
      POSTGRES_DB: data_foundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry_user -d data_foundry"]
      interval: 5s
      timeout: 5s
      retries: 5

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: data_foundry_label_studio
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
    environment:
      - DJANGO_DB=sqlite
      - LABEL_STUDIO_USERNAME=admin@datafoundry.com
      - LABEL_STUDIO_PASSWORD=admin123
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: data_foundry_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: data_foundry_prefect_server
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://foundry_user:foundry_password@db:5432/data_foundry
      - PREFECT_SERVER_API_HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prefect_data:/root/.prefect

  prefect-agent:
    image: prefecthq/prefect:2-python3.11
    container_name: data_foundry_prefect_agent
    command: prefect agent start --pool default-agent-pool
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      - prefect-server
      - redis
    volumes:
      - prefect_data:/root/.prefect
      - ./src:/app/src

  # Main API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_foundry_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://foundry_user:foundry_password@db:5432/data_foundry
      - REDIS_URL=redis://redis:6379/0
      - LABEL_STUDIO_URL=http://label-studio:8080
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - IP_HASH_SALT=gdpr-compliance-salt-min-32-chars-for-security-required!
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # GDPR Compliance Settings
      - ENABLE_GDPR_AUDIT_LOGGING=true
      - GDPR_CONSENT_STORAGE_RETENTION_DAYS=2555  # 7 years
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      - ENABLE_RATE_LIMITING=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # K6 General Load Testing Service
  k6:
    image: grafana/k6:latest
    container_name: data_foundry_k6_general
    environment:
      - BASE_URL=http://api:8000
      - API_TOKEN=${API_TOKEN:-}
    volumes:
      - ./tests:/tests
      - ./results:/results
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - general-load
    command: run --out json=/results/general-load.json tests/load/k6-ramp-up.js
    restart: "no"

  # K6 GDPR Compliance Load Testing Service
  k6-gdpr:
    image: grafana/k6:latest
    container_name: data_foundry_k6_gdpr
    environment:
      - BASE_URL=http://api:8000
      - API_TOKEN=${API_TOKEN:-}
    volumes:
      - ./tests:/tests
      - ./results:/results
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - gdpr-load
    command: run --out json=/results/gdpr-compliance.json tests/load/gdpr-compliance-k6.js
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  label_studio_data:
  prefect_data:

networks:
  default:
    name: data_foundry_network