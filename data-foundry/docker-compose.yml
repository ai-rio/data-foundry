
services:
  # The Database: PostgreSQL with Row-Level Security for Multi-Tenancy
  db:
    image: postgres:15-alpine
    container_name: data_foundry_db
    environment:
      POSTGRES_USER: foundry_user
      POSTGRES_PASSWORD: foundry_password
      POSTGRES_DB: data_foundry
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with system PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry_user -d data_foundry"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Human-in-the-Loop UI
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: data_foundry_label_studio
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
    environment:
      - DJANGO_DB=sqlite
      - LABEL_STUDIO_USERNAME=admin@datafoundry.com
      - LABEL_STUDIO_PASSWORD=admin123
    # SQLite will be used for simpler setup
    # In production, can migrate to PostgreSQL later
    depends_on:
      db:
        condition: service_healthy

  # The Task Queue Broker
  redis:
    image: redis:7-alpine
    container_name: data_foundry_redis
    ports:
      - "6380:6379"  # Use 6380 to avoid conflict with system Redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prefect Server for Workflow Orchestration
  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: data_foundry_prefect_server
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://foundry_user:foundry_password@db:5432/data_foundry
      - PREFECT_SERVER_API_HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prefect_data:/root/.prefect

  # The Main FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_foundry_api
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql+asyncpg://foundry_user:foundry_password@db:5432/data_foundry
      - REDIS_URL=redis://redis:6379/0  # Docker internal port (not 6380)
      - LABEL_STUDIO_URL=http://label-studio:8080
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - IP_HASH_SALT=gdpr-compliance-salt-min-32-chars-for-security-required!
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Stripe Billing Configuration (loaded from .env.local)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_AI_LABEL_METER_ID=${STRIPE_AI_LABEL_METER_ID}
      - STRIPE_HUMAN_AUDIT_METER_ID=${STRIPE_HUMAN_AUDIT_METER_ID}
      - STRIPE_AI_LABEL_METER_EVENT=${STRIPE_AI_LABEL_METER_EVENT}
      - STRIPE_HUMAN_AUDIT_METER_EVENT=${STRIPE_HUMAN_AUDIT_METER_EVENT}
      - STRIPE_GOLD_AI_LABELS_PRICE_ID=${STRIPE_GOLD_AI_LABELS_PRICE_ID}
      - STRIPE_GOLD_HUMAN_AUDITS_PRICE_ID=${STRIPE_GOLD_HUMAN_AUDITS_PRICE_ID}
      - STRIPE_GOLD_PLATFORM_FEE_PRICE_ID=${STRIPE_GOLD_PLATFORM_FEE_PRICE_ID}
      - STRIPE_SILVER_AI_LABELS_PRICE_ID=${STRIPE_SILVER_AI_LABELS_PRICE_ID}
      - STRIPE_SILVER_HUMAN_AUDITS_PRICE_ID=${STRIPE_SILVER_HUMAN_AUDITS_PRICE_ID}
      - STRIPE_SILVER_PLATFORM_FEE_PRICE_ID=${STRIPE_SILVER_PLATFORM_FEE_PRICE_ID}
      - STRIPE_BRONZE_AI_LABELS_PRICE_ID=${STRIPE_BRONZE_AI_LABELS_PRICE_ID}
      - STRIPE_BRONZE_HUMAN_AUDITS_PRICE_ID=${STRIPE_BRONZE_HUMAN_AUDITS_PRICE_ID}
      - STRIPE_BRONZE_PLATFORM_FEE_PRICE_ID=${STRIPE_BRONZE_PLATFORM_FEE_PRICE_ID}
      # GDPR Compliance Settings
      - ENABLE_GDPR_AUDIT_LOGGING=true
      - GDPR_CONSENT_STORAGE_RETENTION_DAYS=2555  # 7 years
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      - ENABLE_RATE_LIMITING=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Prefect Agent for Task Execution
  prefect-agent:
    image: prefecthq/prefect:2-python3.11
    container_name: data_foundry_prefect_agent
    command: prefect agent start --pool default-agent-pool
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      - prefect-server
      - redis
    volumes:
      - prefect_data:/root/.prefect
      - ./src:/app/src

  # Background Job Worker for Processing Uploaded Data
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data_foundry_worker
    command: python -m src.workers.main
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql+asyncpg://foundry_user:foundry_password@db:5432/data_foundry
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - IP_HASH_SALT=gdpr-compliance-salt-min-32-chars-for-security-required!
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Stripe Billing Configuration (loaded from .env.local)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_AI_LABEL_METER_ID=${STRIPE_AI_LABEL_METER_ID}
      - STRIPE_HUMAN_AUDIT_METER_ID=${STRIPE_HUMAN_AUDIT_METER_ID}
      - STRIPE_AI_LABEL_METER_EVENT=${STRIPE_AI_LABEL_METER_EVENT}
      - STRIPE_HUMAN_AUDIT_METER_EVENT=${STRIPE_HUMAN_AUDIT_METER_EVENT}
      - STRIPE_GOLD_AI_LABELS_PRICE_ID=${STRIPE_GOLD_AI_LABELS_PRICE_ID}
      - STRIPE_GOLD_HUMAN_AUDITS_PRICE_ID=${STRIPE_GOLD_HUMAN_AUDITS_PRICE_ID}
      - STRIPE_GOLD_PLATFORM_FEE_PRICE_ID=${STRIPE_GOLD_PLATFORM_FEE_PRICE_ID}
      - STRIPE_SILVER_AI_LABELS_PRICE_ID=${STRIPE_SILVER_AI_LABELS_PRICE_ID}
      - STRIPE_SILVER_HUMAN_AUDITS_PRICE_ID=${STRIPE_SILVER_HUMAN_AUDITS_PRICE_ID}
      - STRIPE_SILVER_PLATFORM_FEE_PRICE_ID=${STRIPE_SILVER_PLATFORM_FEE_PRICE_ID}
      - STRIPE_BRONZE_AI_LABELS_PRICE_ID=${STRIPE_BRONZE_AI_LABELS_PRICE_ID}
      - STRIPE_BRONZE_HUMAN_AUDITS_PRICE_ID=${STRIPE_BRONZE_HUMAN_AUDITS_PRICE_ID}
      - STRIPE_BRONZE_PLATFORM_FEE_PRICE_ID=${STRIPE_BRONZE_PLATFORM_FEE_PRICE_ID}
      # Worker Configuration
      - WORKER_POLL_INTERVAL=2
      - WORKER_MAX_RETRIES=3
      - WORKER_BACKOFF_BASE=1.0
      - WORKER_BATCH_SIZE=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  label_studio_data:
  prefect_data:

networks:
  default:
    name: data_foundry_network